<section class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <h1 class="text-4xl text-center">Forgot password.</h1>

    <div class="mt-10 w-[60%] mx-auto">
        <form [formGroup]="forgotPasswordForm" (ngSubmit)="forgotPassword()" class="space-y-4 p-10 border border-gray-200 shadow-lg shadow-gray-400">
            @if(errorMessage) {
                <p class="error">{{errorMessage}}</p>
            }

            @if(requestSent) {
                <p>If an account matches that email, we’ll send a reset link.</p>
            }

            <div>
                <label for="email" class="block text-sm/6 font-medium">Email: </label>
                <input id="email" type="email" formControlName="email" class="px-2 rounded-lg border border-gray-200 shadow shadow-gray-400 w-full">

                @if (forgotPasswordForm.get("email")?.invalid && forgotPasswordForm.get("email")?.touched) {
                    <span class="error">Should be a valid email address.</span>
                }
            </div>

            <div class="text-center">
                <button type="submit" class="p-2 bg-gray-200 shadow-md shadow-gray-400 w-full">Submit.</button>
            </div>
        </form>
    </div>
</section>
