<div class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none px-4 sm:px-0">
  @for (toast of toasts(); track toast.notification.id) {
    <div 
      class="pointer-events-auto bg-gray-900 text-white border-l-4 border-brand rounded-lg shadow-2xl p-4 flex items-start justify-between gap-3 transform transition-all duration-300 ease-out animate-slide-in cursor-pointer hover:bg-gray-800"
      (click)="handleClick(toast.notification)"
    >
      <div class="flex items-start gap-3 flex-1 min-w-0">
        <div class="text-brand shrink-0 mt-0.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-semibold text-brand uppercase tracking-wider">Live Notification</p>
          <p class="text-sm font-medium text-gray-100 truncate mt-0.5">{{ toast.notification.content }}</p>
        </div>
      </div>
      <button 
        type="button" 
        (click)="$event.stopPropagation(); removeToast(toast.notification.id)" 
        class="text-gray-400 hover:text-white transition p-1 rounded-md"
        aria-label="Close notification"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
