<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-sm">
    <h1 class="text-4xl text-center">Sign in</h1>
  </div>

  <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
    <form (ngSubmit)="login()" class="space-y-4 p-10 border border-gray-200 shadow-lg shadow-gray-400">
      <div>
        <label for="email" class="block text-sm/6 font-medium">Email address&nbsp;<small class="text-gray-400">*required*</small></label>
        <div class="mt-2">
          <input id="email" type="email" name="email" [(ngModel)]="credentials.email" required autocomplete="email" class="px-2 rounded-lg border border-gray-200 shadow shadow-gray-400 w-full"/>
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm/6 font-medium">Password&nbsp;<small class="text-gray-400">*required*</small></label>
          <div class="text-sm">
            <a routerLink="/forgot-password" class="font-semibold text-indigo-400 hover:text-indigo-300">Forgot password?</a>
          </div>
        </div>
        <div class="mt-2">
          <input id="password" type="password" name="password" [(ngModel)]="credentials.password" required autocomplete="current-password" class="px-2 rounded-lg border border-gray-200 shadow shadow-gray-400 w-full"/>
        </div>
      </div>

      <div>
        <button type="submit" class="p-2 bg-gray-200 shadow-md shadow-gray-400 w-full">Sign in</button>
      </div>
    </form>
  </div>
</div>
